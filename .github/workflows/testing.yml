name: Continuous integration testing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    name: Continuous integration tests
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync

      - name: Run the automated tests
        run: make test

  status:
    name: Release status
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync

      # Reports which packages will be published when this merges, and fails if
      # a version moved without a changelog entry or with a stale lock file.
      - name: Check the release plan
        run: uv run mono status --check
