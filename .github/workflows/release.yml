name: Release packages

# Merging to main publishes every package whose version is not yet on PyPI.
# Version numbers are set before the merge, by `mono version` applying the
# change fragments in `.changes/`.

concurrency:
  group: "release"
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Publish packages to PyPI
    runs-on: ubuntu-latest
    # Approval for this environment is the release gate; PyPI trusted
    # publishing is configured against it, so no API token is needed.
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync

      - name: Set up git environment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Report what will be published
        run: uv run mono publish --dry-run

      - name: Publish and tag releases
        run: uv run mono publish

      - name: Push tags to repository
        # Push whatever was tagged, even if a later package failed to publish.
        if: always()
        run: git push --tags
