[project]
name = "macrostrat.schema_management"
version = "2.0.1"
description = "Declarative schemas, schema diffs and condition-checked migrations for PostgreSQL"
authors = [
    { name = "Daven Quinn", email = "dev@davenquinn.com" },
    { name = "Matthew Westphall" },
    { name = "Amy Fromandi" },
]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "macrostrat.database>=4.7.0,<5.0.0",
    "macrostrat.utils>=1.3.3,<2",
    "SQLAlchemy>=2.0.0,<3",
    "psycopg>=3.1,<4",
    "pydantic>=2,<3",
    "rich>=13,<16",
    "typer>=0.22,<0.27",
    "click>=8.1.0,<10",
    "sqlparse>=0.5,<1",
    "results>=2.0.0,<2.1.0",
    "docker>=7.0.0,<8",
    "testcontainers>=4.14.2",
]

[dependency-groups]
dev = [
    "macrostrat.database",
    "macrostrat.utils",
    "pytest>=9.1.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
"macrostrat.database" = { path = "../database", editable = true }
"macrostrat.utils" = { path = "../utils", editable = true }

[tool.uv.build-backend]
module-name = ["macrostrat"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"
